[project]
name = "rte"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ly Amadou", email = "amzoly.lionpanjshir@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastparquet>=2026.9.0",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "requests>=2.34.2",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
]

[project.scripts]
rte = "rte:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
